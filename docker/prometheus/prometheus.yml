global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:

  # ── AtlasPay Application ───────────────────────────────────────────────────
  - job_name: 'atlaspay'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: atlaspay
    # Scrape more frequently during active development
    scrape_interval: 5s

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
