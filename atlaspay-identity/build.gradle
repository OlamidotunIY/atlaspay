dependencies {
    implementation project(':atlaspay-shared-kernel')

    // Spring context for @Component, @Service etc in use cases
    implementation 'org.springframework.boot:spring-boot-starter'
    // Spring Data JPA for persistence adapters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Spring Web for REST controllers
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Security crypto for PasswordEncoder
    implementation 'org.springframework.security:spring-security-crypto'
    // Swagger annotations for OpenAPI
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Observability — Micrometer for metrics counters/timers on use case execution
    implementation 'io.micrometer:micrometer-core'

    // Test: WireMock for Dojah adapter integration tests
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
    testImplementation 'org.testcontainers:mysql'
}
